    const choices = [
      {
        code: "weather",
        name: "Weather / rain / unsafe court",
        icon: "cloud-rain"
      },
      {
        code: "venue_issue",
        name: "Court maintenance or venue issue",
        icon: "wrench"
      },
      {
        code: "host_emergency",
        name: "Host emergency / illness",
        icon: "heart-pulse"
      },
      {
        code: "insufficient_players",
        name: "Not enough players",
        icon: "users"
      },
      { code: "other", name: "Other reason", icon: "ellipsis" }
    ];
    let current = "cancel",
      cancelled = false,
      reasonCode = "weather",
      message =
        "Due to heavy rain, the outdoor courts are flooded and the club has closed them for safety. Sorry for the change of plans.",
      read = false,
      unread = false,
      confirming = false;
    const selected = () => choices.find((r) => r.code === reasonCode);
    const safe = (value) =>
      value.replace(
        /[&<>"']/g,
        (c) =>
          ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
          })[c]
      );
    const icon = (n) => `<i data-lucide="${n}" aria-hidden="true"></i>`;
    const status = () =>
      `<div class="status"><span>9:41</span><span>${icon("signal")}${icon("wifi")}${icon("battery-full")}</span></div>`;
    const summary = () =>
      `<div class="summary"><img src="${photo}" alt="Padel court"><div><h3>Friday Social Padel</h3><p class="muted">Fri 23 Oct · 19:00–20:30</p></div></div>`;
    const avatars = () =>
      `<div class="avatars" aria-label="10 affected players"><span class="av">MS</span><span class="av">EV</span><span class="av">DK</span><span class="av">LR</span><span class="av">+6</span></div>`;
    const bar = (name) =>
      `<div class="bar"><button class="icon-button back" aria-label="Back" data-action="back">${icon("arrow-left")}</button><h2>${name}</h2></div>`;
    const tabs = () =>
      `<div class="tabbar"><div>${icon("layout-grid")}Overview</div><div class="selected">${icon("calendar-days")}Sessions</div><div>${icon("message-square")}Messages</div><div>${icon("user")}Profile</div></div>`;
    function detail() {
      return `${status()}<div class="page">${bar("Session details")}<img class="hero" src="${photo}" alt="Padel courts"><div class="panel"><div class="spread"><h3>Friday Social Padel</h3>${cancelled ? '<span class="pill">Cancelled</span>' : ""}</div><p class="muted small">Fri 23 Oct · 19:00–20:30</p><p class="line muted small mini-gap">${icon("map-pin")}Riverside Padel Club</p></div><div class="spread top-gap"><span class="label">Players</span><span class="muted small">8 / 8 places</span></div><div class="panel"><div class="roster-row row"><span class="av">MS</span><div><strong>Marcos Silva</strong><p class="muted small">${cancelled ? "Registration cancelled" : "Confirmed"}</p></div></div><div class="roster-row row"><span class="av">EV</span><div><strong>Elena Vega</strong><p class="muted small">${cancelled ? "Registration cancelled" : "Confirmed"}</p></div></div><p class="small muted mini-gap">6 more players · 2 on the waitlist</p></div>${cancelled ? `<p class="muted small top-gap">${selected().name}</p>` : '<button class="ghost danger-text top-gap" data-action="cancel">Cancel session</button>'}</div>${tabs()}${cancelled ? `<div class="toast"><span class="toast-icon">${icon("check")}</span><span>Session cancelled</span></div>` : ""}<div class="footline"></div>`;
    }
    function inbox() {
      return `${status()}<div class="page">${bar("Notifications")}<div class="line"><button class="filter ${!unread ? "active" : ""}" data-action="all">All</button><button class="filter ${unread ? "active" : ""}" data-action="unread">Unread</button></div><div class="section-title">Today</div>${unread && read ? '<div class="empty">You’re all caught up</div>' : `<button class="notification" data-action="reader"><div class="notification-content"><span class="tile">${icon("calendar-x")}</span><div style="min-width:0;flex:1"><div class="title">Session cancelled ${!read ? '<span class="dot" aria-label="Unread"></span>' : ""}</div><p>Friday Social Padel</p><p class="muted small">Fri 23 Oct · 19:00–20:30</p><p class="muted mini-gap">${selected().name}</p><p class="muted small mini-gap">Just now</p></div></div></button>`}</div><div class="footline"></div>`;
    }
    function cancellationPage() {
      return `${status()}<div class="cancellation-page">${bar("Cancel session")}<div class="summary-panel">${summary()}<div class="recipient">${avatars()}<p class="muted small">8 confirmed · 2 waitlisted</p></div></div><div class="section-heading"><h3 id="reason-heading">Reason for cancellation</h3><span class="required">Required</span></div><div class="reason-options" role="radiogroup" aria-labelledby="reason-heading">${choices.map((r) => `<button class="reason-option" role="radio" aria-checked="${r.code === reasonCode}" data-reason="${r.code}"><span class="tile">${icon(r.icon)}</span><span class="reason-name">${r.name}</span><span class="radio" aria-hidden="true"></span></button>`).join("")}</div><div class="section-heading"><h3><label for="palla-cancel-message" style="font:inherit;margin:0">Message to players</label></h3><span class="required">Optional</span></div><textarea id="palla-cancel-message" maxlength="1000" placeholder="Add any details players should know…">${safe(message)}</textarea><div class="counter"><span id="palla-cancel-count">${message.length}</span> / 1,000</div><div class="message-note">${icon("send")}Included in the cancellation notification</div><p class="subtext">All 10 players will be notified and their registrations cancelled. This can’t be undone.</p><button class="primary danger" data-action="confirm">Cancel session</button><button class="ghost" data-action="back">Keep session</button></div>${confirming ? `<div class="native-confirm"><section class="native-dialog" role="alertdialog" aria-label="Confirm cancellation"><h3>Cancel Friday Social Padel?</h3><p>The session on 23 October will be cancelled and 10 players notified.</p><button class="danger-text" data-action="finish">Cancel session</button><button data-action="keep-editing">Keep editing</button></section></div>` : ""}`;
    }
    function reader() {
      return `<div class="scrim"><section class="sheet" role="dialog" aria-label="Session cancelled"><div class="handle"></div><div class="sheet-head"><h2>Session cancelled</h2><button class="icon-button" data-action="close" aria-label="Close">${icon("x")}</button></div>${summary()}<hr class="rule"><div class="row"><span class="host-avatar">AR</span><div><p><strong>Alex Rivera</strong></p><p class="muted small">Cancelled today at 09:41</p></div></div><div class="reason-label">Reason</div><div class="reason-title">${icon(selected().icon)}${selected().name}</div>${message.trim() ? `<div class="top-gap"><p>${safe(message.trim())}</p></div>` : ""}<p class="muted small top-gap">Your registration has been cancelled.</p><button class="primary top-gap" data-action="message">${icon("message-square")}Message host</button></section></div>`;
    }
    function render() {
      phone.classList.toggle("full-form", current === "cancel");
      phone.innerHTML =
        current === "cancel"
          ? cancellationPage()
          : current === "reader"
            ? inbox() + reader()
            : current === "detail"
              ? detail()
              : inbox();
      root
        .querySelectorAll("[data-view]")
        .forEach((b) =>
          b.setAttribute("aria-pressed", String(b.dataset.view === current))
        );
      if (globalThis.lucide) lucide.createIcons();
      const input = phone.querySelector("textarea");
      if (input)
        input.addEventListener("input", () => {
          message = input.value;
          phone.querySelector("#palla-cancel-count").textContent =
            message.length;
        });
    }
    root.addEventListener("click", (e) => {
      const b = e.target.closest("button");
      if (!b) return;
      if (b.dataset.view) {
        current = b.dataset.view;
        confirming = false;
        if (current === "reader") read = true;
        render();
        return;
      }
      if (b.dataset.reason) {
        reasonCode = b.dataset.reason;
        render();
        return;
      }
      switch (b.dataset.action) {
        case "cancel":
          current = "cancel";
          break;
        case "close":
          current = "inbox";
          break;
        case "confirm":
          confirming = true;
          break;
        case "keep-editing":
          confirming = false;
          break;
        case "finish":
          confirming = false;
          cancelled = true;
          current = "detail";
          break;
        case "reader":
          current = "reader";
          read = true;
          break;
        case "all":
          unread = false;
          break;
        case "unread":
          unread = true;
          break;
        case "back":
          current = "detail";
          break;
        case "message": {
          const toast = document.createElement("div");
          toast.className = "toast";
          toast.setAttribute("role", "status");
          toast.textContent = "Opens your chat with Alex Rivera";
          phone.append(toast);
          setTimeout(() => toast.remove(), 2600);
          return;
        }
      }
      render();
    });
    render();
  })();
</script>
